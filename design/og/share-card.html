<!doctype html>
<!--
  Template for the share card images in public/og/ (1200 × 630).
  Regenerate after changing the text or design, from the repository root:
    msedge --headless --hide-scrollbars --window-size=1200,630 \
      --screenshot=public/og/og-en.png "file:///<repo>/design/og/share-card.html?lang=en"
  and the same with lang=tr.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter";
    src: url("../../public/fonts/inter-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212;
  }
  @font-face {
    font-family: "Inter";
    src: url("../../public/fonts/inter-latin-ext-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #15232B;
    color: #F5F7F6;
    font-family: "Inter", sans-serif;
    font-feature-settings: "cv11", "ss01";
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 56px;
    box-sizing: border-box;
    position: relative;
  }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; }
  .brand svg { width: 72px; height: 72px; }
  h1 { font-size: 64px; line-height: 1.08; letter-spacing: -0.035em; margin: 0 0 20px; max-width: 820px; }
  p { font-size: 28px; line-height: 1.35; color: #C9D3CF; margin: 0; max-width: 760px; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; }
  .foot img { height: 64px; }
  .layers { position: absolute; right: -120px; top: -40px; width: 520px; height: 520px; opacity: 0.18; }
  .bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 10px; background: #F5C400; }
</style>
</head>
<body>
  <svg class="layers" viewBox="0 0 64 64" aria-hidden="true">
    <g fill="none" stroke-width="5.5" stroke-linecap="round">
      <path d="M50.38 13.62 A26 26 0 1 0 50.38 50.38" stroke="#F5F7F6"/>
      <path d="M44.73 19.27 A18 18 0 1 0 44.73 44.73" stroke="#2BB3A3"/>
      <path d="M39.07 24.93 A10 10 0 1 0 39.07 39.07" stroke="#A48BE6"/>
    </g>
  </svg>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <g fill="none" stroke-width="5.5" stroke-linecap="round">
        <path d="M50.38 13.62 A26 26 0 1 0 50.38 50.38" stroke="#F5F7F6"/>
        <path d="M44.73 19.27 A18 18 0 1 0 44.73 44.73" stroke="#2BB3A3"/>
        <path d="M39.07 24.93 A10 10 0 1 0 39.07 39.07" stroke="#A48BE6"/>
      </g>
      <circle cx="32" cy="32" r="3.5" fill="#F5C400"/>
    </svg>
    3D Care
  </div>
  <div>
    <h1 id="title"></h1>
    <p id="lead"></p>
  </div>
  <div class="foot">
    <img id="emblem" alt="">
  </div>
  <div class="bar"></div>
  <script>
    var text = {
      en: {
        title: "Assistive tools anyone can print",
        lead: "Open 3D models for adults with disabilities, tested in real care settings, with training for educators and care staff.",
        emblem: "../../src/assets/eu/co-funded-en-neg.png",
      },
      tr: {
        title: "Herkesin basabileceği yardımcı araçlar",
        lead: "Engelli yetişkinler için gerçek bakım ortamlarında test edilen açık 3D modeller ve eğitimciler ile bakım personeli için eğitim.",
        emblem: "../../src/assets/eu/co-funded-tr-neg.png",
      },
    }[new URLSearchParams(location.search).get("lang") || "en"];
    document.documentElement.lang = new URLSearchParams(location.search).get("lang") || "en";
    document.getElementById("title").textContent = text.title;
    document.getElementById("lead").textContent = text.lead;
    document.getElementById("emblem").src = text.emblem;
  </script>
</body>
</html>
